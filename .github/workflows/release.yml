name: Build public release assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Verify release tag is on trusted default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git check-ref-format --branch "$DEFAULT_BRANCH"
          git fetch origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" --no-tags
          TAG_COMMIT="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          test "$TAG_COMMIT" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$TAG_COMMIT" "refs/remotes/origin/$DEFAULT_BRANCH"
      - name: Check release packaging
        run: python3 -m unittest scripts.release.test_pipeline
      - name: Check signed update and npm verification paths
        run: go test ./internal/update ./internal/cli ./scripts/release && node --test scripts/release-install.test.js
      - name: Build and verify CLI and daemon archives
        run: python3 scripts/release/pipeline.py build --version "$GITHUB_REF_NAME" --output dist
      - name: Sign release manifest with the maintainer key
        env:
          OWNBOT_RELEASE_PRIVATE_KEY: ${{ secrets.OWNBOT_RELEASE_PRIVATE_KEY }}
        run: python3 scripts/release/pipeline.py sign --key-id ownbot-release-2026 --output dist
      - name: Verify signed release assets
        run: python3 scripts/release/pipeline.py verify --output dist --require-signature
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi
