name: Record sandbox explainer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install edge-tts==7.3.1
      - name: Build actual daemon
        run: |
          go build -o "$RUNNER_TEMP/ownbotd" ./cmd/ownbotd
          go build -o "$RUNNER_TEMP/ownbot" ./cmd/ownbot
      - name: Narrate public script with free neural voice
        run: python demo-site/scripts/explainer/voice.py
      - name: Record whiteboard and actual sandbox interactions
        env:
          OWNBOTD_BINARY: ${{ runner.temp }}/ownbotd
          OWNBOT_BINARY: ${{ runner.temp }}/ownbot
        run: npx playwright test --config demo-site/scripts/explainer/playwright.config.cjs
      - name: Compose and inspect video
        run: python demo-site/scripts/explainer/compose.py
      - uses: actions/upload-artifact@v4
        with:
          name: ownbot-whiteboard-explainer
          path: |
            demo-site/scripts/explainer/output/ownbot-explainer.mp4
            demo-site/scripts/explainer/output/captions.srt
          retention-days: 14
